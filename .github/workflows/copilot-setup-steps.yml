name: Copilot Setup Steps

"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Use a GPT-6 Astra compatible reasoning effort
        run: echo "COPILOT_AGENT_REASONING_EFFORT=xhigh" >> "$GITHUB_ENV"
